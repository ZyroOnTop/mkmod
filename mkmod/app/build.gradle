plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wb.goog.mkx'
    compileSdk 34

    defaultConfig {
        applicationId "com.wb.goog.mkx"
        minSdk 24
        targetSdk 34
        versionCode 1449740
        versionName "7.4.0-mod"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
