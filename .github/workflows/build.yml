name: MK Mod Build — 7.4.0 — Dobby Stable v4

on:
  workflow_dispatch:
    inputs:
      xapk_url:
        description: 'URL direta do XAPK do MK Mobile 7.4.0'
        required: true
        type: string

jobs:
  build:
    name: Build + Inject + Sign
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      NDK_VERSION:  '26.3.11579264'
      BUILD_TOOLS:  '34.0.0'
      API_LEVEL:    '24'
      ANDROID_SDK:  '/opt/android-sdk'
      DOBBY_COMMIT: '0932d69c320e786672361ab53825ba8f4245e9d3'

    steps:

    # ── 1. Checkout ──────────────────────────────────────────────────────────
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Confirmar versao do workflow - DOBBY STABLE V4
      run: |
        echo "::notice::DOBBY STABLE V4 ATIVO"
        echo "Commit utilizado: $GITHUB_SHA"
        echo "Ref selecionada: $GITHUB_REF"

    # ── 2. Java 17 ───────────────────────────────────────────────────────────
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # ── 3. Android SDK do zero (sem action externa) ───────────────────────────
    - name: Setup Android SDK + NDK
      run: |
        set -e

        # baixa cmdline-tools
        mkdir -p ${{ env.ANDROID_SDK }}/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
          -O /tmp/cmdtools.zip
        unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
        mv /tmp/cmdtools/cmdline-tools ${{ env.ANDROID_SDK }}/cmdline-tools/latest

        # exporta variáveis
        export ANDROID_SDK_ROOT=${{ env.ANDROID_SDK }}
        export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"     >> $GITHUB_ENV
        echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH

        # aceita licenças
        yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses > /dev/null 2>&1 || true

        # instala NDK, CMake, build-tools
        yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT \
          "ndk;${{ env.NDK_VERSION }}" \
          "cmake;3.22.1" \
          "build-tools;${{ env.BUILD_TOOLS }}"

        # exporta NDK
        echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV
        echo "$ANDROID_SDK_ROOT/build-tools/${{ env.BUILD_TOOLS }}"     >> $GITHUB_PATH

        echo "NDK: $(ls $ANDROID_SDK_ROOT/ndk/)"
        echo "Done."

    # ── 4. System deps ────────────────────────────────────────────────────────
    - name: Install system deps
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q \
          apktool zipalign python3 git wget unzip cmake ninja-build

    # ── 5. Clonar dependências C++ ────────────────────────────────────────────
    - name: Clone C++ dependencies
      working-directory: app/src/main/cpp
      run: |
        set -euo pipefail
        git clone --depth=1 https://github.com/MJx0/KittyMemory.git KittyMemory
        # O master atual do Dobby possui erros de API e assembly ARM64.
        # Usar o commit completo citado por outro projeto que compila Android arm64.
        git clone https://github.com/jmpews/Dobby.git Dobby
        git -C Dobby checkout --detach "$DOBBY_COMMIT"
        DOBBY_CHECKED_OUT="$(git -C Dobby rev-parse HEAD)"
        test "$DOBBY_CHECKED_OUT" = "$DOBBY_COMMIT"
        echo "::notice::Dobby pinado em $DOBBY_CHECKED_OUT"
        test -f Dobby/CMakeLists.txt
        test -f Dobby/include/dobby.h
        test -f Dobby/source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_bridge_arm64.cc
        git clone --depth=1 https://github.com/LGLTeam/Android-Mod-Menu.git Menu

    # ── 6. Dobby ARM64: fonte historica estavel, sem patch ELF ─────────────
    - name: Build Dobby ARM64 from pinned working commit [V4]
      shell: bash
      run: |
        set -euo pipefail
        cd app/src/main/cpp/Dobby
        echo "Dobby commit: $(git rev-parse HEAD)"
        test "$(git rev-parse HEAD)" = "$DOBBY_COMMIT" || {
          echo '::error::Versao errada do Dobby! Build interrompido.'
          exit 1
        }
        # Essa revisao utiliza o bridge ARM64 em C++; nao usa o assembly
        # @PAGE/@PAGEOFF que quebrou no master em 2026.
        test -f source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_bridge_arm64.cc
        rm -rf build_arm64
        cmake -S . -B build_arm64 -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM="android-${{ env.API_LEVEL }}" \
          -DCMAKE_BUILD_TYPE=Release \
          -DDOBBY_DEBUG=OFF \
          -DDOBBY_BUILD_EXAMPLE=OFF \
          -DDOBBY_BUILD_TEST=OFF
        cmake --build build_arm64 --target dobby_static --parallel 4
        test -s build_arm64/libdobby.a || {
          echo '::error::Dobby compilou mas nao gerou libdobby.a.'
          exit 1
        }
        NDK_NM="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
        "$NDK_NM" -g --defined-only build_arm64/libdobby.a > /tmp/dobby-symbols.txt
        grep -Eq '[[:space:]]DobbyHook$' /tmp/dobby-symbols.txt || {
          echo '::error::libdobby.a nao contem DobbyHook.'
          exit 1
        }
        mkdir -p libs/arm64-v8a
        cp build_arm64/libdobby.a libs/arm64-v8a/libdobby.a
        echo '::notice::Dobby estavel ARM64 compilado com sucesso!'
        ls -lh libs/arm64-v8a/libdobby.a

    # ── 7. LGL Menu (stub quando o upstream nao fornece libMenu.so) ──────────
    - name: Build LGL Menu arm64-v8a
      run: |
        cd app/src/main/cpp/Menu
        mkdir -p build_arm64 && cd build_arm64
        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_NATIVE_API_LEVEL=${{ env.API_LEVEL }} \
          -DCMAKE_BUILD_TYPE=Release \
          -G Ninja || true
        ninja -j$(nproc) 2>/dev/null || make -j$(nproc) 2>/dev/null || true

        mkdir -p ../libs/arm64-v8a ../include
        SO=$(find . -name 'libMenu.so' | head -1)
        if [ -n "$SO" ]; then
          cp "$SO" ../libs/arm64-v8a/libMenu.so
          echo "Menu lib: $SO"
        else
          echo '::warning::LGL nao gerou libMenu.so. Criando somente stub para vinculacao; este stub NAO exibe menu funcional.'
          cat > /tmp/menu_stub.cpp << 'STUB'
        #include <android/log.h>
        extern "C" {
          void StartMenuThread(const char* t) { __android_log_print(2,"MKMenu","started: %s",t); }
          bool GetToggleState(int id) { return false; }
          float GetSliderValue(int id) { return 1.0f; }
          void RegisterToggle(int id, const char* l, bool d) {}
          void RegisterSlider(int id, const char* l, float mn, float mx, float d) {}
        }
        STUB
          $ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++ \
            -shared -fPIC -o ../libs/arm64-v8a/libMenu.so /tmp/menu_stub.cpp -llog
          echo "Stub created."
        fi

        [ -f ../include/Menu.h ] || cat > ../include/Menu.h << 'INC'
        extern "C" {
          void StartMenuThread(const char* title);
          bool GetToggleState(int id);
          float GetSliderValue(int id);
          void RegisterToggle(int id, const char* label, bool def);
          void RegisterSlider(int id, const char* label, float min, float max, float def);
        }
        INC
        ls -lh ../libs/arm64-v8a/

    # ── 9. Download XAPK ──────────────────────────────────────────────────────
    - name: Download MK Mobile XAPK
      shell: bash
      env:
        XAPK_URL: ${{ inputs.xapk_url }}
      run: |
        set -euo pipefail
        test -n "$XAPK_URL" || { echo 'URL do XAPK vazia'; exit 1; }
        curl --fail --location --retry 3 --connect-timeout 30 --max-time 1200 \
          --user-agent 'Mozilla/5.0' --output mk740.xapk "$XAPK_URL"
        test -s mk740.xapk
        unzip -tq mk740.xapk | tail -2
        ls -lh mk740.xapk

    # ── 10. Extrair APK e libgame.so ──────────────────────────────────────────
    - name: Extract APK and libgame.so
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p xapk_contents extracted
        unzip -q mk740.xapk -d xapk_contents/
        mapfile -d '' APKS < <(find xapk_contents -type f -iname '*.apk' -print0)
        if [ "${#APKS[@]}" -eq 0 ]; then
          echo 'ERRO: XAPK nao contem APKs.'
          exit 1
        fi
        BASE_APK=''
        for apk in "${APKS[@]}"; do
          if [ "$(basename "$apk")" = 'base.apk' ]; then BASE_APK="$apk"; break; fi
        done
        if [ -z "$BASE_APK" ]; then
          for apk in "${APKS[@]}"; do
            case "$(basename "$apk")" in split_*) ;; *) BASE_APK="$apk"; break ;; esac
          done
        fi
        BASE_APK="${BASE_APK:-${APKS[0]}}"
        cp "$BASE_APK" base.apk
        echo "Base APK: $BASE_APK"

        FOUND=0
        for apk in "${APKS[@]}"; do
          if unzip -Z1 "$apk" | grep -Fx 'lib/arm64-v8a/libgame.so' >/dev/null; then
            unzip -p "$apk" lib/arm64-v8a/libgame.so > libgame.so
            FOUND=1
            echo "libgame.so extraida de: $apk"
            break
          fi
        done
        if [ "$FOUND" -ne 1 ]; then
          echo 'ERRO: nenhum APK do XAPK possui lib/arm64-v8a/libgame.so.'
          echo 'Bibliotecas encontradas:'
          for apk in "${APKS[@]}"; do
            echo "-- $apk"
            unzip -Z1 "$apk" | grep -E '^lib/.*\.so$' | head -20 || true
          done
          exit 1
        fi
        test -s libgame.so
        ls -lh base.apk libgame.so
        if [ "${#APKS[@]}" -gt 1 ]; then
          echo 'AVISO: XAPK com APKs split. Assinar somente o base.apk nao recria um APK universal.'
        fi

    # ── 11. Scan offsets ──────────────────────────────────────────────────────
    - name: Scan offsets from libgame.so
      shell: bash
      run: |
        set -euo pipefail
        test -s libgame.so || { echo 'libgame.so ausente'; exit 1; }
        test -f scripts/find_offsets.py || { echo 'scripts/find_offsets.py ausente'; exit 1; }
        python3 scripts/find_offsets.py libgame.so
        test -s hack_offsets.env || { echo 'Script nao gerou hack_offsets.env'; exit 1; }
        cat hack_offsets.env

    # ── 12. Inject offsets no hack.h ─────────────────────────────────────────
    - name: Inject offsets into hack.h
      run: |
        set -euo pipefail
        python3 scripts/inject_and_patch.py \
          hack_offsets.env \
          app/src/main/cpp/hack.h \
          /dev/null


    # ── 13. Build MKMod.so (com offsets injetados) ──────────────────────────
    - name: Build MKMod arm64-v8a
      shell: bash
      run: |
        set -euo pipefail
        cmake -S app/src/main/cpp -B build_mkmod -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM="android-${{ env.API_LEVEL }}" \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build_mkmod --parallel 4
        test -s build_mkmod/libMKMod.so
        mkdir -p mod_lib/lib/arm64-v8a
        cp build_mkmod/libMKMod.so mod_lib/lib/arm64-v8a/
        ls -lh mod_lib/lib/arm64-v8a/libMKMod.so


    # ── 14. Descompilar APK ───────────────────────────────────────────────────
    - name: Decompile base APK
      shell: bash
      run: |
        set -euo pipefail
        apktool d base.apk -o mk_decompiled/ --force -q
        test -f mk_decompiled/AndroidManifest.xml
        find mk_decompiled -maxdepth 1 -name 'smali*' -print

    # ── 15. Inject libs + patch smali ─────────────────────────────────────────
    - name: Inject libs + patch smali
      run: |
        set -euo pipefail
        mkdir -p mk_decompiled/lib/arm64-v8a
        cp mod_lib/lib/arm64-v8a/libMKMod.so mk_decompiled/lib/arm64-v8a/
        cp app/src/main/cpp/Menu/libs/arm64-v8a/libMenu.so mk_decompiled/lib/arm64-v8a/
        ls -lh mk_decompiled/lib/arm64-v8a/
        python3 scripts/inject_and_patch.py \
          hack_offsets.env \
          app/src/main/cpp/hack.h \
          mk_decompiled/


    # ── 16. Patch manifest ────────────────────────────────────────────────────
    - name: Patch AndroidManifest
      run: |
        set -euo pipefail
        MANIFEST=mk_decompiled/AndroidManifest.xml
        grep -q 'SYSTEM_ALERT_WINDOW' "$MANIFEST" || \
          sed -i 's|<application|<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>\n    <application|' "$MANIFEST"
        echo "Manifest OK"

    # ── 17. Recompilar APK ────────────────────────────────────────────────────
    - name: Recompile APK
      shell: bash
      run: |
        set -euo pipefail
        apktool b mk_decompiled/ -o mk_modded.apk --use-aapt2
        test -s mk_modded.apk
        ls -lh mk_modded.apk

    # ── 18. Assinar APK ───────────────────────────────────────────────────────
    - name: Sign APK
      run: |
        set -euo pipefail
        keytool -genkey -v \
          -keystore mk.keystore -alias mk \
          -keyalg RSA -keysize 2048 -validity 3650 \
          -storepass mkmodpass -keypass mkmodpass \
          -dname "CN=MKMod,O=Mod,C=BR" -noprompt
        zipalign -v 4 mk_modded.apk mk_aligned.apk
        apksigner sign \
          --ks mk.keystore \
          --ks-pass pass:mkmodpass \
          --key-pass pass:mkmodpass \
          --ks-key-alias mk \
          --out mk_final.apk \
          mk_aligned.apk
        apksigner verify mk_final.apk && echo "Signature OK"
        ls -lh mk_final.apk

    # ── 19. Upload artifacts ──────────────────────────────────────────────────
    - name: Upload modded APK
      uses: actions/upload-artifact@v4
      with:
        name: MK-Mobile-7.4.0-MODDED
        path: mk_final.apk
        retention-days: 7

    - name: Upload libgame.so
      uses: actions/upload-artifact@v4
      with:
        name: libgame-so-1449740
        path: libgame.so
        if-no-files-found: ignore
        retention-days: 7

    - name: Upload offsets report
      uses: actions/upload-artifact@v4
      with:
        name: offsets-report
        path: hack_offsets.env
        if-no-files-found: ignore
        retention-days: 7

 
    - name: Build summary
      if: always()
      run: |
        echo "## MK Mod 7.4.0 Build" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        [ -f hack_offsets.env ] && cat hack_offsets.env >> "$GITHUB_STEP_SUMMARY" || echo "(no offsets found)" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        if [ -f mk_final.apk ]; then
          APK_SIZE=$(du -h mk_final.apk | cut -f1)
        else
          APK_SIZE="N/A"
        fi
        echo "APK: $APK_SIZE" >> "$GITHUB_STEP_SUMMARY"

